name: Build All Environments

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'

jobs:
  # Dev branch: create alpha tag once before all builds
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            # Keep the tag stable if this commit is rebuilt on another day.
            SHORT_SHA=$(git rev-parse --short HEAD)
            COMMIT_DATE=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d HEAD)
            DEV_TAG="dev-${COMMIT_DATE}-${SHORT_SHA}"
            echo "tag_name=$DEV_TAG" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create alpha tag (dev only)
        if: github.ref_type == 'branch'
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git push origin "HEAD:refs/tags/$TAG_NAME"

  build:
    needs: prepare
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        env: [
          bjww, bjwwnew, bjnw, bjnwhttps, bdww, bdnw, lhfyww, lhfynw, hnww, hnnw, smww, smnw, stzlww, stzlnw, zxww,
          zxnw, lgww, sebb, sebbww, sedp, sedpww, selh, selhww, xhww, xhnw, lglsww, lglsnw, lglssk, gzbjww, gzbjnw,
          yzrmnw
        ]

    uses: ./.github/workflows/build-and-publish-env.yml
    with:
      environment_name: ${{ matrix.env }}
      tag_name: ${{ needs.prepare.outputs.tag_name }}
      prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}

  # Keep only the latest 5 alpha releases
  cleanup:
    needs: [prepare, build]
    if: needs.prepare.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete old alpha releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          KEEP=5
          # List all dev pre-releases, newest first
          DEV_RELEASES=$(gh release list --limit 100 --exclude-drafts --json tagName,isPrerelease \
            | jq -r '[.[] | select(.isPrerelease and (.tagName | startswith("dev-")))] | sort_by(.tagName) | reverse | .[].tagName')

          COUNT=0
          for tag in $DEV_RELEASES; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Deleting old alpha release: $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
